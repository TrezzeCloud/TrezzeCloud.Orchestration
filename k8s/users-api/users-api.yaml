apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-api
  template:
    metadata:
      labels:
        app: users-api
        admission.datadoghq.com/enabled: "true"
      annotations:
        admission.datadoghq.com/dotnet-lib.version: "3"
    spec:
      containers:
        - name: users-api
          image: gu1m4ss1/trezzecloud-users-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: users-api-config
            - secretRef:
                name: users-api-secret
---
apiVersion: v1
kind: Service
metadata:
  name: users-api
spec:
  type: NodePort
  selector:
    app: users-api
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30081