apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-api
  template:
    metadata:
      labels:
        app: catalog-api
    spec:
      containers:
        - name: catalog-api
          image: CATALOG_API_IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: RabbitMq__Host
              value: rabbitmq
            - name: RabbitMq__Username
              valueFrom:
                secretKeyRef:
                  name: users-demo-secrets
                  key: RabbitMq__Username
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: users-demo-secrets
                  key: RabbitMq__Password
            - name: Jwt__Issuer
              value: TrezzeCloud
            - name: Jwt__Audience
              value: TrezzeCloud
            - name: Jwt__SecretKey
              valueFrom:
                secretKeyRef:
                  name: users-demo-secrets
                  key: Jwt__SecretKey
            - name: ConnectionStrings__CatalogDatabase
              valueFrom:
                secretKeyRef:
                  name: catalog-demo-secrets
                  key: ConnectionStrings__CatalogDatabase
            - name: MongoDb__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: catalog-demo-secrets
                  key: MongoDb__ConnectionString
            - name: MongoDb__DatabaseName
              value: TrezzeCloudCatalog
            - name: Redis__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: catalog-demo-secrets
                  key: Redis__ConnectionString
            - name: Elasticsearch__Endpoint
              valueFrom:
                secretKeyRef:
                  name: catalog-search-secrets
                  key: Elasticsearch__Endpoint
                  optional: true
            - name: Elasticsearch__ApiKey
              valueFrom:
                secretKeyRef:
                  name: catalog-search-secrets
                  key: Elasticsearch__ApiKey
                  optional: true
            - name: Elasticsearch__IndexName
              value: fcg-games
          resources:
            requests:
              cpu: 120m
              memory: 180Mi
            limits:
              cpu: 750m
              memory: 700Mi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 75
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
spec:
  type: ClusterIP
  selector:
    app: catalog-api
  ports:
    - name: http
      port: 8080
      targetPort: http
